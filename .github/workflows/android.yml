name: Build TREINE AI APK

# Robusto quanto ao layout: encontra sozinho a pasta do projeto (a que
# contém settings.gradle.kts), esteja ela na raiz ou dentro de uma subpasta.
# Assim funciona mesmo quando os arquivos sobem aninhados pelo "upload" da web.
on:
  push:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Localizar a pasta do projeto
        id: find
        run: |
          set -euo pipefail
          FOUND=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "Não encontrei settings.gradle.kts no repositório." >&2
            find . -maxdepth 3 -name '*.gradle.kts' >&2 || true
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Projeto em: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Baixar o modelo de pose do MediaPipe
        # O modelo (~3 MB) não fica no repositório; é buscado aqui e
        # empacotado no APK, para o app funcionar sem internet no celular.
        run: |
          set -euo pipefail
          DIR="${{ steps.find.outputs.dir }}"
          mkdir -p "$DIR/app/src/main/assets"
          curl -fSL --retry 3 --retry-delay 2 \
            -o "$DIR/app/src/main/assets/pose_landmarker_lite.task" \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          ls -lh "$DIR/app/src/main/assets/pose_landmarker_lite.task"

      - name: Restaurar a chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/treineai.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/treineai.jks" >> "$GITHUB_ENV"

      - name: Compilar o APK de release
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Conferir o APK gerado
        run: |
          set -euo pipefail
          APK=$(find "${{ steps.find.outputs.dir }}/app/build/outputs/apk/release" -name '*.apk' | head -1)
          echo "APK gerado: $APK"
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" || true

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: treine-ai-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Anexar o APK à release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
